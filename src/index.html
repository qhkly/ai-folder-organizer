<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Folder Organizer</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
<div id="app">
  <header id="toolbar">
    <span id="toolbar-title">AI Folder Organizer</span>
    <div id="dir-row">
      <button id="btn-pick-dir" class="btn-ghost btn-sm" title="选择目录">📁</button>
      <span id="current-dir" title="当前目录">未选择目录</span>
    </div>
    <div id="toolbar-actions">
      <button id="btn-settings" class="btn-ghost" title="设置">⚙ API Key</button>
      <button id="btn-theme" class="btn-ghost btn-sm" title="切换主题"></button>
    </div>
  </header>

  <main id="workspace">
    <section id="tree-panel" class="pane">
      <div class="pane-header">
        <div>
          <h2>当前目录树</h2>
          <p id="tree-count">等待扫描</p>
        </div>
        <button id="btn-rescan" class="btn-ghost btn-sm" disabled>刷新</button>
      </div>
      <div id="tree-list">
        <div class="empty-state">点击左上角选择一个测试目录</div>
      </div>
    </section>

    <section id="plan-panel" class="pane">
      <div class="pane-header">
        <div>
          <h2>整理方案预览</h2>
          <p id="plan-count">尚未分析</p>
        </div>
        <button id="btn-clear-plan" class="btn-ghost btn-sm" disabled>清空</button>
      </div>
      <div id="plan-description">AI 方案会显示在这里，执行前请逐条审阅。</div>
      <div id="plan-list">
        <div class="empty-state">扫描后点击底部“分析”</div>
      </div>
    </section>
  </main>

  <footer id="bottom-bar">
    <div id="bottom-actions">
      <button id="btn-analyze" class="btn-primary" disabled>分析</button>
      <button id="btn-execute" class="btn-primary" disabled>执行整理</button>
      <button id="btn-undo" class="btn-ghost" disabled>↩ 撤销</button>
      <button id="btn-log-clear" class="btn-ghost btn-sm">清空日志</button>
    </div>
    <div id="log-output"></div>
  </footer>

  <div id="settings-modal" class="modal hidden">
    <div class="modal-backdrop"></div>
    <div class="modal-box">
      <h2>设置</h2>
      <div class="form-group">
        <label for="s-api-key">Anthropic API Key</label>
        <input id="s-api-key" type="password" autocomplete="off" placeholder="sk-ant-..." />
      </div>
      <div class="form-group">
        <label for="s-model">模型</label>
        <select id="s-model">
          <option value="claude-opus-4-7">claude-opus-4-7</option>
          <option value="claude-sonnet-4-6">claude-sonnet-4-6</option>
        </select>
      </div>
      <div class="form-group">
        <label for="s-last-dir">上次目录</label>
        <input id="s-last-dir" type="text" placeholder="/path/to/folder" />
      </div>
      <div class="modal-actions">
        <button id="btn-settings-save" class="btn-primary">保存</button>
        <button id="btn-settings-cancel" class="btn-ghost">取消</button>
      </div>
    </div>
  </div>
</div>
<script src="main.js"></script>
</body>
</html>
